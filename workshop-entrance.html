<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>SpellQuest · Meeting the owl</title>
  <link rel="stylesheet" href="workshop-entrance.css?v=journey-art-1">
  <link rel="stylesheet" href="entrance-motion.css?v=journey-art-1">
</head>
<body>
  <main class="preview-shell">
    <header><a class="wordmark" href="./">SpellQuest</a><h1>Meeting the owl</h1></header>
    <figure>
      <div id="entrance" class="entrance" data-phase="ready" role="img" aria-label="The boy faces the owl across a workbench, with a sleeping pen between them.">
        <img class="workshop-frame" src="docs/concepts/owl-workshop-style-v1.png" alt="" fetchpriority="high">
        <div id="cut-in" class="cut-in" hidden aria-hidden="true">
          <div class="panel boy-panel"><svg class="speed-lines" viewBox="0 0 800 800" preserveAspectRatio="none"></svg><div class="portrait boy"><img src="assets/workshop/entrance-characters-v1.png" alt=""></div></div>
          <div class="panel owl-panel"><svg class="speed-lines" viewBox="0 0 800 800" preserveAspectRatio="none"></svg><div class="portrait owl"><img src="assets/workshop/entrance-characters-v1.png" alt=""></div></div>
          <span class="divider"></span>
        </div>
      </div>
      <figcaption id="entrance-status" role="status" aria-atomic="true">Opening motion preview.</figcaption>
    </figure>
    <nav aria-label="Preview controls">
      <button id="replay" type="button" disabled>Replay entrance</button>
      <button id="skip" type="button" disabled>Skip entrance</button>
      <a href="workshop.html?scene=owl">Open working workshop</a>
    </nav>
    <p class="preview-note">A short motion study. The workshop image is a still; the working spelling interaction opens separately.</p>
    <noscript><p>The still image is available. Enable JavaScript to play the entrance.</p></noscript>
  </main>
  <script type="module" src="src/workshop-entrance.js?v=journey-art-1"></script>
</body>
</html>
